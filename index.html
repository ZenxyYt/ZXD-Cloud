
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friday Night Funkin'</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #17112b, #25205c);
      color: white;
      text-align: center;
    }

    header {
      background: #101020;
      padding: 25px;
      border-bottom: 4px solid #00eaff;
    }

    h1 {
      color: #00eaff;
      font-size: 42px;
      text-shadow: 3px 3px #ed32c5;
    }

    .hero {
      padding: 65px 20px;
    }

    .hero h2 {
      font-size: 32px;
    }

    .play-button {
      display: inline-block;
      background: #ed32c5;
      color: white;
      padding: 18px 45px;
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 12px;
      box-shadow: 0 5px #941b83;
      cursor: pointer;
    }

    .play-button:hover {
      background: #00bddd;
      transform: scale(1.05);
    }

    .characters {
      padding: 30px;
    }

    .characters h2 {
      color: #00eaff;
    }

    footer {
      background: #101020;
      padding: 20px;
      margin-top: 50px;
    }
  </style>
</head>

<body>
  <header>
    <h1>FRIDAY NIGHT FUNKIN'</h1>
    <p>Welcome to the FNF Fan Website!</p>
  </header>

  <section class="hero">
    <h2>Are you ready to rap battle?</h2>
    <p>Get ready to hit those notes!</p>
    <a class="play-button" href="#characters">LET'S GO!</a>
  </section>

  <section class="characters" id="characters">
    <h2>Characters</h2>
    <p>Boyfriend 🎤 | Girlfriend ❤️ | Pico 🔫</p>
    <p>More characters coming soon!</p>
  </section>

  <footer>
    <p>Unofficial Friday Night Funkin' Fan Website</p>
  </footer>
</body>
</html>
